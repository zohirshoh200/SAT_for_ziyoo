ul{padding-left:20px;margin:6px 0}.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.kb button{padding:10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);font-size:17px}#cd{font-size:22px;min-height:48px}li{margin:4px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}

{d:"cs",q:"Despite the critics’ harsh reviews, the novelist remained ______, continuing to write with full confidence in her own vision.",c:["ambivalent","undeterred","reluctant","indifferent"],a:1,e:"“Undeterred” — tanqidga qaramay davom etdi, ma’nosi mos."},

const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(q,ans,ds,e){let s=[ans];ds.forEach(d=>{if(!s.includes(d))s.push(d)});while(s.length<4){const v=ans+r(2,9)*(Math.random()<.5?-1:1);if(!s.includes(v))s.push(v)}s=shuffle(s.slice(0,4));return{q,c:s.map(String),a:s.indexOf(ans),e,val:ans}}
function mkS(q,c,e){const s=shuffle(c.map((t,i)=>({t,i})));return{q,c:s.map(x=>x.t),a:s.findIndex(x=>x.i==0),e}}

alg:[
()=>{const a=r(2,9),x=r(2,12),b=r(1,20),c=a*x+b;return mk(`If ${a}x + ${b} = ${c}, what is the value of x?`,x,[x+1,x-1,c-b],`${a}x = ${c-b}, shuning uchun x = ${x}.`)},
()=>{const x=r(3,15),y=r(1,x-1);return mk(`x + y = ${x+y} and x − y = ${x-y}. What is the value of x?`,x,[y,x+1,x-1],`Tenglamalarni qo‘shamiz: 2x = ${2*x}, x = ${x}.`)},
()=>{const m=r(1,6)*(Math.random()<.5?-1:1),x1=r(0,4),x2=x1+r(1,4),y1=r(-5,5),y2=y1+m*(x2-x1);return mk(`A line passes through the points (${x1}, ${y1}) and (${x2}, ${y2}). What is the slope of the line?`,m,[-m,m+1,m-1],`Slope = (${y2} − ${y1}) / (${x2} − ${x1}) = ${m}.`)},
()=>{const a=r(3,9),b=r(2,6),m=r(5,20);return mk(`A taxi company charges a flat fee of $${a} plus $${b} per mile. What is the total cost, in dollars, of a ${m}-mile ride?`,a+b*m,[a*m+b,(a+b)*m,a+b+m],`Narx = ${a} + ${b}·${m} = ${a+b*m}.`)},
()=>{const a=r(2,6),x=r(2,9),t=r(1,a),b=r(1,9);return mk(`What is the greatest integer x for which ${a}x + ${b} < ${a*x+b+t}?`,x,[x+1,x-1,x+2],`${a}x < ${a*x+t}, ya’ni x < ${x} + ${t}/${a}. Eng katta butun son ${x}.`)}],

()=>{const a=r(1,6),b=r(1,6);return mk(`What is the sum of the solutions to (x − ${a})(x + ${b}) = 0?`,a-b,[a+b,b-a,a*b],`Yechimlar: x = ${a} va x = ${-b}. Yig‘indi ${a-b}.`)},
()=>{const P=r(2,9)*5;return mk(`The function f is defined by f(t) = ${P} · 2^t. What is the value of f(3)?`,P*8,[P*6,P*9,P*16],`2³ = 8, demak f(3) = ${P*8}.`)},
()=>{const a=r(2,5),b=r(1,9),k=r(2,5);return mk(`If f(x) = ${a}x² + ${b}, what is the value of f(${k})?`,a*k*k+b,[(a*k)**2+b,a*k+b,a*k*k-b],`${a} × ${k*k} + ${b} = ${a*k*k+b}.`)},
()=>{const a=r(1,9),b=r(2,9);return mk(`What is the greater solution of (x − ${a})² = ${b*b}?`,a+b,[a-b,b,a*b],`x − ${a} = ±${b}, katta yechim x = ${a+b}.`)},
()=>{const a=r(2,9),b=r(2,9);return mk(`If 2^${a} · 2^${b} = 2^x, what is the value of x?`,a+b,[a*b,a-b,2*(a+b)],`Darajalar qo‘shiladi: ${a} + ${b} = ${a+b}.`)}],

()=>{const p=[10,20,25,40,50][r(0,4)],n=r(2,12)*20,v=n*p/100;return mk(`What is ${p}% of ${n}?`,v,[n-v,v+10,v-10],`${n} × ${p/100} = ${v}.`)},
()=>{const m=r(10,30),n=[0,0,0,0].map(()=>r(m-6,m+6)),f=5*m-n.reduce((s,v)=>s+v,0);return mk(`The mean of five numbers is ${m}. Four of the numbers are ${n.join(", ")}. What is the fifth number?`,f,[m,f+5,f-5],`Yig‘indi = 5 × ${m} = ${5*m}; qolgani ${f}.`)},
()=>{const p=[10,20,25,50][r(0,3)],o=r(2,10)*20,n=o*(100+p)/100;return mk(`The price of an item increased from $${o} to $${n}. By what percent did the price increase?`,p,[p+5,p-5,n-o],`(${n} − ${o}) / ${o} = ${p/100} → ${p}%.`)},
()=>{const a=r(2,5),b=a+r(1,3),k=r(2,6);return mk(`The ratio of boys to girls in a club is ${a}:${b}. If the club has ${k*(a+b)} members, how many are girls?`,k*b,[k*a,a+b,k*(a+b)-a],`Bir qism = ${k*(a+b)} / ${a+b} = ${k}; qizlar ${b} × ${k} = ${k*b}.`)},
()=>{const s=shuffle([r(2,9),r(10,19),r(20,29),r(30,39),r(40,49)]),o=s.slice().sort((p,q)=>p-q);return mk(`A data set contains the values ${s.join(", ")}. What is the median of the data set?`,o[2],[s[2]===o[2]?o[1]:s[2],o[1],o[3]],`Tartiblaymiz: ${o.join(", ")}. Median o‘rtadagi qiymat: ${o[2]}.`)}],

const sh=q=>{const o=shuffle(q.c.map((t,i)=>({t,i})));return{...q,c:o.map(x=>x.t),a:o.findIndex(x=>x.i===q.a)}};
function mathQs(n,doms,sp){return Array.from({length:n},(_,i)=>{const d=doms[i%doms.length],q=G[d][r(0,G[d].length-1)]();q.d=d;if(sp&&q.val!==undefined&&Math.random()<.25)q.sp=1;return q})}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const $=s=>document.querySelector(s),app=$("#app");
let S={view:"home"},T;
const cur=()=>S.mods[S.mi];
const has=(m,i)=>m.ans[i]!=null&&m.ans[i]!=="";
const isOk=(q,a)=>q.sp?(a!=null&&a!==""&&Math.abs(parseFloat(a)-q.val)<1e-6):a===q.a;
const sc=([c,n])=>n?Math.round((200+600*c/n)/10)*10:0;
const ld=()=>{try{return JSON.parse(localStorage.getItem("satH")||"[]")}catch(e){return[]}};
const sv=h=>{try{localStorage.setItem("satH",JSON.stringify(h.slice(-30)))}catch(e){}};
function tab(v){clearInterval(T);S={view:v};render()}
function start(k,d){
 const M=[];
 if(k=="p"){const rw=RWD.includes(d);M.push({n:D[d]+" — mashq",k:rw?"r":"m",pr:1,time:0,qs:rw?shuffle(RW.filter(q=>q.d==d)).slice(0,8).map(sh):mathQs(8,[d],0)})}
 else{
  if(k!="m"){const b=shuffle(RW);[0,1].forEach(i=>M.push({n:"Reading and Writing — "+(i+1)+"-modul",k:"r",time:CFG.rwMin*60,qs:b.slice(i*CFG.rw,(i+1)*CFG.rw).map(sh)}))}
  if(k!="r")[0,1].forEach(i=>M.push({n:"Math — "+(i+1)+"-modul",k:"m",time:CFG.mMin*60,qs:mathQs(CFG.m,MD,1)}))
 }
 M.forEach(m=>{m.ans={};m.fl={}});S={view:"quiz",k,mods:M,mi:0,qi:0,ask:0};begin();
}
function begin(){clearInterval(T);S.left=cur().time;if(S.left)T=setInterval(tick,1000);render()}
function tick(){S.left--;const e=$("#tm");if(e)e.textContent=fmt(Math.max(S.left,0));if(S.left<=0)endMod()}
function calc(){const det={},sec={r:[0,0],m:[0,0]};S.mods.forEach(m=>m.qs.forEach((q,i)=>{const o=isOk(q,m.ans[i]);det[q.d]=det[q.d]||[0,0];det[q.d][1]++;sec[m.k][1]++;if(o){det[q.d][0]++;sec[m.k][0]++}}));return{det,sec}}
function endMod(){clearInterval(T);
 if(S.mi<S.mods.length-1)S.view="brk";
 else{S.R=calc();const h=ld();h.push({t:Date.now(),k:S.k,r:sc(S.R.sec.r),m:sc(S.R.sec.m),det:S.R.det});sv(h);S.view="res"}
 render()}
function nextMod(){S.mi++;S.qi=0;S.ask=0;S.view="quiz";begin()}
const choose=i=>{const m=cur();if(m.pr&&has(m,S.qi))return;m.ans[S.qi]=i;render()};
const spv=v=>{cur().ans[S.qi]=v};
const flag=()=>{const m=cur();m.fl[S.qi]=!m.fl[S.qi];render()};
const go=i=>{S.qi=i;S.ask=0;render()};
const ask=v=>{S.ask=v;render()};
const bar=(d,v)=>{const p=Math.round(100*v[0]/v[1]);return `<div class="bl"><span>${D[d]}</span><span>${p}% (${v[0]}/${v[1]})</span></div><div class="bar"><i style="width:${p}%"></i></div>`};
const CL={s:"0",a:null,o:null,f:0};
const ap=(a,o,b)=>o=="+"?a+b:o=="−"?a-b:o=="×"?a*b:o=="÷"?a/b:b;
function kp(k){
 if("0123456789.".includes(k)){CL.s=(CL.f||CL.s=="0")&&k!="."?k:CL.s+k;CL.f=0}
 else if(k=="C"){CL.s="0";CL.a=null;CL.o=null;CL.f=0}
 else if(k=="±")CL.s=String(-parseFloat(CL.s));
 else if(k=="√")CL.s=String(+Math.sqrt(parseFloat(CL.s)).toFixed(8));
 else if(k=="x²"){const v=parseFloat(CL.s);CL.s=String(+(v*v).toFixed(8))}
 else if(k=="π"){CL.s="3.14159265";CL.f=1}
 else{const b=parseFloat(CL.s);CL.a=CL.o&&!CL.f?ap(CL.a,CL.o,b):b;CL.s=String(+CL.a.toFixed(8));CL.o=k=="="?null:k;CL.f=1}
 const e=$("#cd");if(e)e.textContent=CL.s}
const calcUI=()=>`<div class="card"><div id="cd" class="in" style="text-align:right">${CL.s}</div><div class="kb">${["C","±","√","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","π","=","x²"].map(k=>`<button onclick="kp('${k}')">${k}</button>`).join("")}</div></div>`;
function home(){return `<div class="card"><h1>Digital SAT’ga to‘liq tayyorgarlik</h1>
<p class="mu">Rasmiy Digital SAT tuzilmasi: 2 ta bo‘lim, har biri 2 ta modul; Math’da test va “student-produced response” (javobni o‘zingiz yozasiz) savollari; mavzular bo‘yicha mashq va taraqqiyot kuzatuvi.</p></div>
<button class="mode" onclick="start('f')"><b>To‘liq mock test</b><span class="mu">Reading and Writing (2 modul) + Math (2 modul), taymer bilan. Hajmi rasmiy testning taxminan 65 foizi (64 savol).</span></button>
<button class="mode" onclick="start('r')"><b>Faqat Reading and Writing</b><span class="mu">2 modul · ${CFG.rw} tadan savol · ${CFG.rwMin} daqiqadan</span></button>
<button class="mode" onclick="start('m')"><b>Faqat Math</b><span class="mu">2 modul · ${CFG.m} tadan savol · ${CFG.mMin} daqiqadan · har gal yangi sonlar</span></button>
<button class="mode" onclick="tab('prac')"><b>Mavzular bo‘yicha mashq</b><span class="mu">8 ta SAT mavzusi, har javobdan keyin darhol izoh</span></button>
<div class="card mu">Savollar rasmiy SAT uslubi va mavzulari asosida yozilgan original mashqlardir (College Board savollaridan ko‘chirilmagan). Rasmiy namunalar uchun College Board’ning Bluebook ilovasidagi bepul testlaridan ham foydalaning.</div>`}
function prac(){const g=(t,a)=>`<div class="card"><h2>${t}</h2>${a.map(d=>`<button class="mode" onclick="start('p','${d}')"><b>${D[d]}</b><span class="mu">${DD[d]}</span></button>`).join("")}</div>`;
return g("Reading and Writing",RWD)+g("Math",MD)}
function guide(){return `<div class="card"><h2>Digital SAT tuzilmasi</h2><table>
<tr><th>Bo‘lim</th><th>Savol</th><th>Vaqt</th></tr>
<tr><td>Reading and Writing (2 modul)</td><td>54</td><td>64 daq.</td></tr>
<tr><td>Math (2 modul)</td><td>44</td><td>70 daq.</td></tr>
<tr><td><b>Jami</b></td><td><b>98</b></td><td><b>2 s 14 daq.</b></td></tr></table>
<ul><li>Ball: 400–1600 (har bo‘lim 200–800).</li><li>Test adaptiv: 2-modul qiyinligi 1-modul natijasiga bog‘liq.</li><li>Math’da taxminan 25% savol javobni o‘zingiz yozishni talab qiladi.</li><li>Math’da kalkulyator (Desmos) ichiga o‘rnatilgan.</li></ul></div>
<div class="card"><h2>Maslahatlar</h2><ul><li>Reading and Writing: har savol uchun ~1 daqiqa; qiyinini belgilab (⚑) keyinga qoldiring.</li><li>Noto‘g‘ri variantlarni birin-ketin yo‘qoting.</li><li>Xato qilingan mavzularni “Natijalar” sahifasida ko‘ring va shu mavzuda mashq qiling.</li><li>Javobsiz qoldirmang: SAT’da xato uchun ball ayirilmaydi.</li></ul></div>
<div class="card"><h2>Mavzular</h2><ul>${Object.keys(D).map(d=>`<li><b>${D[d]}</b> — ${DD[d]}</li>`).join("")}</ul></div>`}
function hist(){const h=ld().reverse(),agg={};h.forEach(x=>Object.entries(x.det).forEach(([d,v])=>{agg[d]=agg[d]||[0,0];agg[d][0]+=v[0];agg[d][1]+=v[1]}));
return `<div class="card"><h2>Mavzular bo‘yicha o‘zlashtirish</h2>${Object.keys(agg).length?Object.keys(agg).map(d=>bar(d,agg[d])).join(""):`<p class="mu">Hali natija yo‘q. Birinchi testni ishlang.</p>`}</div>
<div class="card"><h2>Oxirgi urinishlar</h2>${h.slice(0,10).map(x=>`<div class="row"><span>${new Date(x.t).toLocaleDateString()} · ${{f:"To‘liq",r:"RW",m:"Math",p:"Mashq"}[x.k]}</span><b>${x.k=="p"?Object.values(x.det).map(v=>v[0]+"/"+v[1]).join(""):(x.r&&x.m?x.r+x.m:x.r||x.m)}</b></div>`).join("")||`<p class="mu">—</p>`}</div>
<p class="mu">Natijalar faqat shu qurilma brauzerida saqlanadi.</p>`}
function quiz(){
 const m=cur(),q=m.qs[S.qi],a=m.ans[S.qi],last=S.qi==m.qs.length-1,un=m.qs.filter((_,i)=>!has(m,i)).length,lock=m.pr&&has(m,S.qi);
 const body=q.sp?`<input class="in" inputmode="decimal" placeholder="Javobni yozing" value="${a??""}" oninput="spv(this.value)"><p class="mu">Javob raqam bo‘lishi kerak.</p>`
 :q.c.map((t,i)=>{let c=a===i?"sel":"";if(lock){if(i==q.a)c="good";else if(a===i)c="wrong"}return `<button class="ch ${c}" onclick="choose(${i})"><i>${"ABCD"[i]}</i><span>${t}</span></button>`}).join("");
 return `<div class="top"><b>${m.n}</b>${m.pr?"":`<span class="tm" id="tm">${fmt(S.left)}</span>`}<button class="g" onclick="tab('home')">Chiqish</button></div>
<div class="card"><div class="row"><span class="mu">Savol ${S.qi+1} / ${m.qs.length} · ${D[q.d]}</span>${m.pr?"":`<button class="g ${m.fl[S.qi]?"on":""}" onclick="flag()">⚑ Belgilash</button>`}</div>
<p class="q">${q.q}</p>${body}${lock?`<div class="ex"><b class="${isOk(q,a)?"ok":"bad"}">${isOk(q,a)?"To‘g‘ri!":"Noto‘g‘ri."}</b> ${q.e}</div>`:""}</div>
${m.k=="m"?`<button class="btn o" style="margin:0 0 10px" onclick="S.calc=!S.calc;render()">🖩 Kalkulyator</button>${S.calc?calcUI():""}`:""}<div class="nav"><button class="btn o" ${S.qi?"":"disabled"} onclick="go(${S.qi-1})">← Oldingi</button>
${last?`<button class="btn" onclick="ask(1)">Yakunlash</button>`:`<button class="btn" onclick="go(${S.qi+1})">Keyingi →</button>`}</div>
<div class="grid">${m.qs.map((_,i)=>`<button class="n ${i==S.qi?"cur":""} ${has(m,i)?"dn":""} ${m.fl[i]?"fl":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div>
${S.ask?`<div class="card"><b>Yakunlaysizmi?</b><p class="mu">Javob berilmagan savollar: ${un}. Keyin qaytib bo‘lmaydi.</p><button class="btn" onclick="endMod()">Ha, yakunlash</button><button class="btn o" onclick="ask(0)">Qaytish</button></div>`:`<button class="btn o" onclick="ask(1)">Modulni yakunlash</button>`}`
}
function brk(){return `<div class="card"><h2>${cur().n} yakunlandi</h2><p class="mu">Qisqa tanaffus qiling. Tayyor bo‘lganingizda keyingi modulni boshlang — taymer shu zahoti ishga tushadi.</p><button class="btn" onclick="nextMod()">${S.mods[S.mi+1].n}ni boshlash</button></div>`}
function res(){
 const {det,sec}=S.R,both=sec.r[1]&&sec.m[1];
 return `<div class="card"><h2>Natija</h2><div class="sc">${both?`<div><b>${sc(sec.r)+sc(sec.m)}</b>Taxminiy jami (400–1600)</div>`:""}
${sec.r[1]?`<div><b>${sc(sec.r)}</b>Reading and Writing<br>${sec.r[0]}/${sec.r[1]} to‘g‘ri</div>`:""}${sec.m[1]?`<div><b>${sc(sec.m)}</b>Math<br>${sec.m[0]}/${sec.m[1]} to‘g‘ri</div>`:""}</div>
<p class="mu">Ball taxminiy hisoblanadi: rasmiy SAT shkalasi adaptiv va murakkabroq.</p></div>
<div class="card"><h2>Mavzular bo‘yicha</h2>${Object.keys(det).map(d=>bar(d,det[d])).join("")}</div>
<button class="btn" onclick="tab('prac')">Zaif mavzuda mashq qilish</button><button class="btn o" onclick="start('${S.k}'${S.k=="p"?",'"+S.mods[0].qs[0].d+"'":""})">Qayta boshlash (yangi savollar)</button>
${S.mods.map(m=>`<div class="card"><h2>${m.n} — tahlil</h2>${m.qs.map((q,i)=>{const o=isOk(q,m.ans[i]),ya=has(m,i)?(q.sp?m.ans[i]:"ABCD"[m.ans[i]]+") "+q.c[m.ans[i]]):"—";return `<details><summary class="${o?"ok":"bad"}">${o?"✓":"✗"} Savol ${i+1} · ${D[q.d]}</summary><p class="q">${q.q}</p>
<div>Sizning javobingiz: <b class="${o?"ok":"bad"}">${ya}</b></div><div>To‘g‘ri javob: <b class="ok">${q.sp?q.val:"ABCD"[q.a]+") "+q.c[q.a]}</b></div><div class="ex">${q.e}</div></details>`}).join("")}</div>`).join("")}`
}
function render(){
 const T2={home:["home","Bosh sahifa"],prac:["prac","Mashq"],guide:["guide","Qo‘llanma"],hist:["hist","Natijalar"]};
 $("#nav").innerHTML=Object.entries(T2).map(([k,[v,t]])=>`<button class="${S.view==k?"on":""}" onclick="tab('${v}')">${t}</button>`).join("");
 app.innerHTML={home,prac,guide,hist,quiz,brk,res}[S.view]();window.scrollTo(0,0)}
render();
</script></body></html>
